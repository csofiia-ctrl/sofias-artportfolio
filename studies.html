
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Studies | _sofiaCaprariu</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="art-pages.css">
</head>


<body class="art-feed-page studies-page">


    <!-- ==================================================
         COMMON MENU
    ================================================== -->

    <div id="site-menu"></div>


    <!-- ==================================================
         PAGE
    ================================================== -->

    <main class="art-page-layout">


        <!-- SIDEBAR -->

        <aside class="art-sidebar">

            <div class="art-search-container">

                <button
                    class="art-sidebar-button"
                    id="searchButton"
                >

                    <svg viewBox="0 0 24 24">

                        <circle cx="11" cy="11" r="6.5"></circle>

                        <line
                            x1="16"
                            y1="16"
                            x2="21"
                            y2="21"
                        ></line>

                    </svg>

                </button>


                <div
                    class="art-search-box"
                    id="searchBox"
                >

                    <input
                        type="text"
                        id="artSearch"
                        placeholder="search..."
                        autocomplete="off"
                    >

                    <div
                        class="art-search-results"
                        id="searchResults"
                    ></div>

                </div>

            </div>


            <button
                class="art-sidebar-button sidebar-heart"
                id="sidebarHeart"
            >

                <svg
                    viewBox="0 0 24 24"
                    width="24"
                    height="24"
                    fill="currentColor"
                >

                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>

                </svg>

            </button>


            <a
                href="index.html"
                class="art-sidebar-button art-home"
            >

                <svg viewBox="0 0 24 24">

                    <path d="M3 11.5L12 4l9 7.5"></path>

                    <path d="M5 10.5V20h14v-9.5"></path>

                    <path d="M9 20v-6h6v6"></path>

                </svg>

            </a>

        </aside>


        <!-- ==================================================
             STUDIES FEED
        ================================================== -->

        <section class="art-feed">

            <div class="art-feed-heading">

                <h1>STUDIES</h1>

                <p>OBSERVATIONS, EXPERIMENTS &amp; PRACTICE</p>

            </div>


            <!-- ==================================================
                 POSTS ARE GENERATED IN art-page.js
                 PHOTOS: assets/images/studies/p1.jpeg - p10.jpeg
            ================================================== -->

            <div id="artPosts"></div>


        </section>

    </main>


    <!-- ==================================================
         IMAGE LIGHTBOX
         Opens when a post image is clicked
    ================================================== -->

    <div
        id="imageLightbox"
        class="image-lightbox"
        aria-hidden="true"
    >

        <button
            class="lightbox-close"
            id="lightboxClose"
            aria-label="Close image"
        >

            &times;

        </button>


        <img
            id="lightboxImage"
            src=""
            alt="Enlarged artwork"
        >

    </div>


    <!-- ==================================================
         SCRIPTS
    ================================================== -->

    <script src="menu.js"></script>

    <script src="art-page.js"></script>


</body>

</html>
